<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المستخدمون — إدارة لقيتها</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="./admin-common.css" rel="stylesheet">
</head>
<body>

<div id="accessDenied">جاري التحقق من الصلاحية...</div>

<div id="app" style="display:none;">
  <div class="main">
    <div id="topbarSlot"></div>

    <div class="content">
      <div class="panel">
        <div class="head">
          <div class="title">المستخدمون</div>
          <div class="search-box" style="min-width:280px;">
            <span>🔎</span>
            <input id="searchInput" placeholder="ابحث بالاسم أو اسم المستخدم...">
          </div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>المستخدم</th><th>الدور</th><th>موثّق</th><th>الحالة</th><th>تاريخ التسجيل</th><th style="text-align:left;">إجراءات</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="6" class="note">جاري التحميل...</td></tr>
          </tbody>
        </table>
        </div>
        <div class="note">تظهر أحدث 50 نتيجة مطابقة للبحث (دالة admin_fetch_users_enriched).</div>
      </div>
    </div>
  </div>

  <div id="sidebarSlot"></div>
</div>

<script src="./admin-guard.js"></script>
<script>
  let currentRole = null;

  const ROLE_LABEL = { user:'مستخدم', merchant:'تاجر', moderator:'مشرف', admin:'أدمن', super_admin:'مدير عام' };

  let searchDebounce = null;
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(loadUsers, 350);
    });
  });

  async function loadUsers() {
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '<tr><td colspan="6" class="note">جاري التحميل...</td></tr>';

    const search = document.getElementById('searchInput').value.trim();
    const { data, error } = await rpc('admin_fetch_users_enriched', { p_search: search || null });

    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="note">تعذّر التحميل: ${escapeHtml(error.message || error.hint || 'خطأ غير معروف')}</td></tr>`; return; }
    if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="note">لا توجد نتائج</td></tr>'; return; }

    const canChangeRole = currentRole === 'super_admin';

    tbody.innerHTML = data.map(u => `
      <tr>
        <td>
          <div style="font-weight:700;">${escapeHtml(u.full_name || '—')}</div>
          <div style="font-size:11px; color:#8a93ab;">@${escapeHtml(u.username || '—')}</div>
        </td>
        <td>
          ${canChangeRole ? `
            <select class="filter-select" onchange="changeRole('${u.id}', this.value)">
              ${['user','merchant','moderator','admin','super_admin'].map(r => `<option value="${r}" ${r===u.role?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}
            </select>
          ` : `<span class="badge-status st-other">${ROLE_LABEL[u.role] || u.role}</span>`}
        </td>
        <td>
          <button class="btn ${u.is_verified ? 'primary' : ''}" onclick="toggleVerified('${u.id}', ${!u.is_verified})">
            ${u.is_verified ? '✅ موثّق' : 'توثيق'}
          </button>
        </td>
        <td>
          ${u.is_banned
            ? '<span class="badge-status st-rejected">محظور</span>'
            : (u.has_suspended_ads ? '<span class="badge-status st-pending">إعلانات معلّقة</span>' : '<span class="badge-status st-active">طبيعي</span>')}
        </td>
        <td>${u.created_at ? new Date(u.created_at).toLocaleDateString('ar') : '—'}</td>
        <td style="text-align:left;">
          <button class="btn ${u.is_banned ? 'primary' : 'danger'}" onclick="toggleBan('${u.id}', ${!u.is_banned})">
            ${u.is_banned ? 'إلغاء الحظر' : 'حظر'}
          </button>
        </td>
      </tr>
    `).join('');
  }

  async function toggleBan(userId, ban) {
    if (!confirm(ban ? 'حظر هذا المستخدم؟ (سيتم إيقاف إعلاناته النشطة تلقائيًا)' : 'إلغاء حظر هذا المستخدم؟')) return;
    const { error } = await rpc('admin_set_ban', { p_user_id: userId, p_banned: ban });
    if (error) { alert('فشل الإجراء: ' + (error.message || error.hint || JSON.stringify(error))); return; }
    loadUsers();
  }

  async function toggleVerified(userId, verified) {
    const { error } = await rpc('admin_toggle_verified', { p_user_id: userId, p_verified: verified });
    if (error) { alert('فشل الإجراء: ' + (error.message || error.hint || JSON.stringify(error))); return; }
    loadUsers();
  }

  async function changeRole(userId, role) {
    if (!confirm(`تغيير دور هذا المستخدم إلى "${ROLE_LABEL[role]}"؟`)) { loadUsers(); return; }
    const { error } = await rpc('admin_set_role', { p_user_id: userId, p_role: role });
    if (error) { alert('فشل الإجراء: ' + (error.message || error.hint || JSON.stringify(error))); }
    loadUsers();
  }

  (async () => {
    const result = await bootAdminPage('users', 'إدارة المستخدمين');
    if (!result) return;
    currentRole = result.role;
    loadUsers();
  })();
</script>
</body>
</html>
