<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البلاغات — إدارة لقيتها</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="./admin-common.css" rel="stylesheet">
</head>
<body>

<div id="accessDenied">جاري التحقق من الصلاحية...</div>

<div id="app" style="display:none;">
  <div class="main">
    <div id="topbarSlot"></div>

    <div class="content">
      <div class="panel">
        <div class="head">
          <div class="title">البلاغات</div>
          <div style="display:flex; gap:10px; align-items:center;">
            <select class="filter-select" id="statusFilter">
              <option value="pending">قيد المراجعة</option>
              <option value="reviewed">تمت المراجعة</option>
              <option value="resolved">تم الحل</option>
              <option value="dismissed">مرفوض</option>
              <option value="">الكل</option>
            </select>
            <button class="btn" onclick="page=0; loadReports();">تحديث</button>
          </div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr><th>السبب</th><th>النوع المستهدف</th><th>الحالة</th><th>تاريخ البلاغ</th><th style="text-align:left;">إجراءات</th></tr>
          </thead>
          <tbody id="reportsTableBody">
            <tr><td colspan="5" class="note">جاري التحميل...</td></tr>
          </tbody>
        </table>
        </div>
        <div class="pager">
          <button class="btn" id="prevBtn" onclick="prevPage()">السابق</button>
          <span id="pagerInfo">صفحة 1</span>
          <button class="btn" id="nextBtn" onclick="nextPage()">التالي</button>
        </div>
      </div>
    </div>
  </div>

  <div id="sidebarSlot"></div>
</div>

<script src="./admin-guard.js"></script>
<script>
  let page = 0;
  const PAGE_SIZE = 20;
  const REPORT_STATUS_LABEL = { pending:'قيد المراجعة', reviewed:'تمت المراجعة', resolved:'تم الحل', dismissed:'مرفوض' };
  const REPORT_STATUS_CLASS = { pending:'st-pending', reviewed:'st-other', resolved:'st-active', dismissed:'st-deleted' };

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('statusFilter').addEventListener('change', () => { page = 0; loadReports(); });
  });

  async function loadReports() {
    const tbody = document.getElementById('reportsTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="note">جاري التحميل...</td></tr>';

    const status = document.getElementById('statusFilter').value;
    let query = `select=id,reason,description,target_type,target_id,status,created_at&order=created_at.desc&limit=${PAGE_SIZE}&offset=${page * PAGE_SIZE}`;
    if (status) query += `&status=eq.${status}`;

    const { data, error } = await selectRows('reports', query);

    if (error) { tbody.innerHTML = `<tr><td colspan="5" class="note">تعذّر التحميل: ${escapeHtml(error.message || error.hint || 'خطأ غير معروف')}</td></tr>`; return; }
    if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="note">لا توجد بلاغات</td></tr>'; document.getElementById('pagerInfo').textContent = `صفحة ${page+1}`; return; }

    tbody.innerHTML = data.map(r => `
      <tr>
        <td>
          <div style="font-weight:700;">${escapeHtml(r.reason)}</div>
          ${r.description ? `<div style="font-size:11px; color:#8a93ab; max-width:280px;">${escapeHtml(r.description)}</div>` : ''}
        </td>
        <td>${escapeHtml(r.target_type)}</td>
        <td><span class="badge-status ${REPORT_STATUS_CLASS[r.status] || 'st-other'}">${REPORT_STATUS_LABEL[r.status] || r.status}</span></td>
        <td>${r.created_at ? new Date(r.created_at).toLocaleDateString('ar') : '—'}</td>
        <td style="text-align:left;">
          ${r.status === 'pending' || r.status === 'reviewed' ? `
            <button class="btn primary" onclick="resolveReport('${r.id}', 'resolved')">تم الحل</button>
            <button class="btn danger" onclick="resolveReport('${r.id}', 'dismissed')">رفض البلاغ</button>
          ` : '—'}
        </td>
      </tr>
    `).join('');

    document.getElementById('pagerInfo').textContent = `صفحة ${page+1}`;
    document.getElementById('prevBtn').disabled = page === 0;
    document.getElementById('nextBtn').disabled = data.length < PAGE_SIZE;
  }

  function prevPage() { if (page > 0) { page--; loadReports(); } }
  function nextPage() { page++; loadReports(); }

  async function resolveReport(id, status) {
    const { error } = await rpc('admin_resolve_report', { p_report_id: id, p_status: status });
    if (error) { alert('فشل الإجراء: ' + (error.message || error.hint || JSON.stringify(error))); return; }
    loadReports();
  }

  (async () => {
    const result = await bootAdminPage('reports', 'البلاغات');
    if (!result) return;
    loadReports();
  })();
</script>
</body>
</html>
