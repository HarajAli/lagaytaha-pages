<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — إدارة لقيتها</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:'Cairo', sans-serif;
    background: radial-gradient(circle at 30% 20%, #1a3a8a 0%, #10275A 55%, #0b1b40 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    background:#fff; width:100%; max-width:400px; border-radius:20px;
    padding:36px 32px; box-shadow:0 30px 70px rgba(0,0,0,.35);
  }
  .card h1 { margin:0 0 6px; font-size:22px; font-weight:900; color:#10275A; text-align:center; }
  .card p.sub { margin:0 0 26px; font-size:13px; color:#8a93ab; text-align:center; }
  label { display:block; font-size:13px; font-weight:700; color:#20264a; margin-bottom:6px; }
  input {
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #E7EAF3;
    font-family:inherit; font-size:14px; margin-bottom:16px; outline:none;
  }
  input:focus { border-color:#F47C48; }
  button {
    width:100%; padding:13px; border:none; border-radius:10px; background:#F47C48;
    color:#fff; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;
  }
  button:disabled { opacity:.6; cursor:not-allowed; }
  #msg { margin-top:14px; font-size:13px; text-align:center; min-height:18px; color:#E24C4C; font-weight:700; }
</style>
</head>
<body>

  <form class="card" id="loginForm" onsubmit="return false">
    <h1>لوحة إدارة لقيتها</h1>
    <p class="sub">هذه الصفحة للمخوّلين بالإدارة فقط</p>

    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" required autocomplete="username">

    <label for="password">كلمة المرور</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button type="submit" id="loginBtn">تسجيل الدخول</button>
    <div class="msg" id="msg"></div>
  </form>

<script>
  // بدون أي مكتبة CDN — نفس أسلوب login.html الأصلي بموقعك (fetch مباشر)
  const SUPABASE_URL = 'https://tnzxnjivkhyjijyotiog.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_4URJrD-YoQyrogg3YnBFkg_gXVIPder';
  const SESSION_KEY = 'laqaytaha_admin_session';

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'جاري التحقق...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      // 1) تسجيل الدخول عبر Supabase Auth (نفس طريقة موقعك تمامًا)
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, 'content-type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error_description || data.msg || 'بيانات الدخول غير صحيحة';
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
        return;
      }

      // 2) التحقق من صلاحية الطاقم (admin/moderator/super_admin) عبر is_staff() الحقيقية
      const staffRes = await fetch(`${SUPABASE_URL}/rest/v1/rpc/is_staff`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          'content-type': 'application/json',
          Authorization: 'Bearer ' + data.access_token,
        },
        body: JSON.stringify({}),
      });
      const isStaff = await staffRes.json().catch(() => false);

      if (!staffRes.ok || isStaff !== true) {
        msg.textContent = 'ليس لديك صلاحية للوصول إلى لوحة الإدارة';
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
        return;
      }

      // 3) حفظ الجلسة والانتقال للوحة
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user: data.user,
      }));
      window.location.href = './admin-dashboard.html';

    } catch (err) {
      msg.textContent = 'تعذر الاتصال بالخادم، حاول مرة أخرى';
      btn.disabled = false;
      btn.textContent = 'تسجيل الدخول';
    }
  });
</script>
</body>
</html>
