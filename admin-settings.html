<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعدادات — إدارة لقيتها</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="./admin-common.css" rel="stylesheet">
</head>
<body>

<div id="accessDenied">جاري التحقق من الصلاحية...</div>

<div id="app" style="display:none;">
  <div class="main">
    <div id="topbarSlot"></div>

    <div class="content">
      <div class="panel">
        <div class="head">
          <div class="title">إعدادات المنصة</div>
          <button class="btn" onclick="loadSettings()">تحديث</button>
        </div>
        <div class="table-scroll">
        <table>
          <thead><tr><th>الإعداد</th><th>القيمة الحالية</th><th style="text-align:left;">تعديل</th></tr></thead>
          <tbody id="settingsTableBody">
            <tr><td colspan="3" class="note">جاري التحميل...</td></tr>
          </tbody>
        </table>
        </div>
        <div class="note">هذي إعدادات عامة مخزّنة بجدول app_settings وتُقرأ مباشرة من الموقع والتطبيق — عدّل بحذر.</div>
      </div>

      <div class="panel">
        <div class="head"><div class="title">إضافة إعداد جديد</div></div>
        <div style="padding:18px 22px; display:flex; gap:10px; flex-wrap:wrap;">
          <input class="search-box" id="newKey" placeholder="اسم المفتاح (مثال: min_price)" style="min-width:220px; border:1px solid #E7EAF3;">
          <input class="search-box" id="newValue" placeholder="القيمة" style="min-width:220px; border:1px solid #E7EAF3;">
          <button class="btn primary" onclick="addSetting()">إضافة / تحديث</button>
        </div>
      </div>

      <div class="panel">
        <div class="head">
          <div class="title">آخر التغييرات</div>
          <button class="btn" onclick="loadHistory()">تحديث</button>
        </div>
        <div class="history-list" id="historyList">
          <div class="note">جاري التحميل...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="sidebarSlot"></div>
</div>

<script src="./admin-guard.js"></script>
<script>
  // ===== وصف عربي لكل إعداد معروف: تسمية، وصف، تصنيف، نوع القيمة، وحساسية =====
  const SETTINGS_META = {
    ai_enabled: {
      label: 'تفعيل الذكاء الاصطناعي', desc: 'تشغيل أو إيقاف ميزات الذكاء الاصطناعي بالتطبيق',
      group: 'عام', type: 'boolean',
    },
    feature_max_days: {
      label: 'أقصى مدة تمييز (أيام)', desc: 'أقصى عدد أيام يمكن تمييز الإعلان خلالها',
      group: 'الإعلانات والتمييز', type: 'number',
    },
    feature_points_per_day: {
      label: 'تكلفة التمييز لليوم (نقطة)', desc: 'عدد النقاط المطلوبة لتمييز إعلان لمدة يوم واحد',
      group: 'الإعلانات والتمييز', type: 'number', sensitive: true,
    },
    platform_fee_percentage: {
      label: 'نسبة عمولة المنصة (%)', desc: 'النسبة التي تُخصم من كل عملية بيع',
      group: 'النقاط والدفع', type: 'number', sensitive: true,
    },
    points_price_yer: {
      label: 'سعر النقطة (ريال يمني)', desc: 'سعر شراء النقطة الواحدة بالريال اليمني',
      group: 'النقاط والدفع', type: 'number', sensitive: true,
    },
    ad_expiry_days: {
      label: 'مدة صلاحية الإعلان (أيام)', desc: 'بعد كم يوم من النشر أو التجديد ينتهي الإعلان تلقائيًا — مُفعّل فعليًا بقاعدة البيانات',
      group: 'الإعلانات والتمييز', type: 'number', sensitive: true,
    },
    auto_hide_reports_threshold: {
      label: 'حد البلاغات للإخفاء التلقائي', desc: 'عدد البلاغات (قيد المراجعة) على نفس الإعلان اللي يرجعه تلقائيًا لمراجعة الإدارة — 0 = إيقاف الميزة',
      group: 'الإعلانات والتمييز', type: 'number', sensitive: true,
    },
    welcome_points: {
      label: 'نقاط ترحيبية لمستخدم جديد', desc: 'عدد النقاط اللي تُمنح تلقائيًا عند إنشاء حساب جديد — 0 = إيقاف الميزة',
      group: 'النقاط والدفع', type: 'number', sensitive: true,
    },
  };
  const GROUP_ORDER = ['عام', 'الإعلانات والتمييز', 'النقاط والدفع', 'أخرى'];

  function metaFor(key) {
    return SETTINGS_META[key] || { label: key, desc: '', group: 'أخرى', type: 'text' };
  }

  // القيمة الأصلية المحمّلة من القاعدة، تُستخدم لزر "تراجع"
  let originalValues = {};

  function inputHtml(key, value, type) {
    const id = 'val_' + key;
    if (type === 'boolean') {
      const isTrue = String(value).toLowerCase() === 'true';
      return `
        <select class="filter-select" id="${id}" data-key="${key}" onchange="onFieldChange('${key}')">
          <option value="true" ${isTrue ? 'selected' : ''}>true</option>
          <option value="false" ${!isTrue ? 'selected' : ''}>false</option>
        </select>`;
    }
    if (type === 'number') {
      return `<input class="search-box" id="${id}" data-key="${key}" type="number" value="${escapeHtml(value)}"
                style="width:140px; border:1px solid #E7EAF3;" oninput="onFieldChange('${key}')">`;
    }
    return `<input class="search-box" id="${id}" data-key="${key}" value="${escapeHtml(value)}"
              style="width:160px; border:1px solid #E7EAF3;" oninput="onFieldChange('${key}')">`;
  }

  function onFieldChange(key) {
    const undoBtn = document.getElementById('undo_' + key);
    if (!undoBtn) return;
    const input = document.getElementById('val_' + key);
    undoBtn.disabled = (input.value === originalValues[key]);
  }

  function undoField(key) {
    const input = document.getElementById('val_' + key);
    input.value = originalValues[key];
    document.getElementById('undo_' + key).disabled = true;
  }

  async function loadSettings() {
    const tbody = document.getElementById('settingsTableBody');
    tbody.innerHTML = '<tr><td colspan="3" class="note">جاري التحميل...</td></tr>';

    const { data, error } = await selectRows('app_settings', 'select=key,value&order=key.asc');

    if (error) { tbody.innerHTML = `<tr><td colspan="3" class="note">تعذّر التحميل: ${escapeHtml(error.message || error.hint || 'خطأ')}</td></tr>`; return; }
    if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="note">لا توجد إعدادات بعد</td></tr>'; return; }

    originalValues = {};
    data.forEach(s => { originalValues[s.key] = s.value; });

    // تجميع حسب التصنيف بترتيب ثابت
    const groups = {};
    data.forEach(s => {
      const meta = metaFor(s.key);
      if (!groups[meta.group]) groups[meta.group] = [];
      groups[meta.group].push(s);
    });

    let html = '';
    GROUP_ORDER.forEach(groupName => {
      const rows = groups[groupName];
      if (!rows || rows.length === 0) return;
      html += `<tr><td colspan="3" class="settings-group-title">${escapeHtml(groupName)}</td></tr>`;
      html += rows.map(s => {
        const meta = metaFor(s.key);
        return `
        <tr>
          <td>
            <div class="setting-name">${escapeHtml(meta.label)}</div>
            ${meta.desc ? `<div class="setting-desc">${escapeHtml(meta.desc)}</div>` : ''}
            <div class="setting-key">${escapeHtml(s.key)}</div>
          </td>
          <td>${escapeHtml(s.value)}</td>
          <td style="text-align:left; display:flex; gap:6px; justify-content:flex-end; align-items:center;">
            ${inputHtml(s.key, s.value, meta.type)}
            <button class="btn" id="undo_${s.key}" onclick="undoField('${s.key}')" disabled>تراجع</button>
            <button class="btn primary" onclick="updateSetting('${s.key}')">حفظ</button>
          </td>
        </tr>`;
      }).join('');
    });
    tbody.innerHTML = html;
  }

  function readFieldValue(key) {
    const el = document.getElementById('val_' + key);
    return el ? el.value : null;
  }

  async function updateSetting(key) {
    const meta = metaFor(key);
    let value = readFieldValue(key);

    if (meta.type === 'number') {
      if (value === '' || isNaN(Number(value))) { alert('القيمة لازم تكون رقم صحيح'); return; }
    }

    if (meta.sensitive) {
      const ok = confirm(`تأكيد تغيير "${meta.label}" من "${originalValues[key]}" إلى "${value}"؟\nهذا الإعداد يؤثر مباشرة على المستخدمين.`);
      if (!ok) return;
    }

    const { error } = await rpc('admin_set_app_setting', { p_key: key, p_value: value });
    if (error) { alert('فشل الحفظ: ' + (error.message || error.hint || JSON.stringify(error))); return; }
    loadSettings();
    loadHistory();
  }

  async function addSetting() {
    const key = document.getElementById('newKey').value.trim();
    const value = document.getElementById('newValue').value;
    if (!key) { alert('اكتب اسم المفتاح'); return; }
    const { error } = await rpc('admin_set_app_setting', { p_key: key, p_value: value });
    if (error) { alert('فشل: ' + (error.message || error.hint || JSON.stringify(error))); return; }
    document.getElementById('newKey').value = '';
    document.getElementById('newValue').value = '';
    loadSettings();
    loadHistory();
  }

  async function loadHistory() {
    const box = document.getElementById('historyList');
    box.innerHTML = '<div class="note">جاري التحميل...</div>';

    const { data, error } = await selectRows(
      'app_settings_history',
      'select=key,old_value,new_value,changed_by,changed_at&order=changed_at.desc&limit=20'
    );

    if (error) { box.innerHTML = `<div class="note">تعذّر تحميل السجل: ${escapeHtml(error.message || error.hint || 'خطأ')}</div>`; return; }
    if (!data || data.length === 0) { box.innerHTML = '<div class="note">لا يوجد سجل تغييرات بعد</div>'; return; }

    // نجيب أسماء اللي عدّلوا (تجميع المعرّفات الفريدة باستعلام واحد)
    const ids = [...new Set(data.map(h => h.changed_by).filter(Boolean))];
    let namesById = {};
    if (ids.length > 0) {
      const { data: profs } = await selectRows('profiles', `id=in.(${ids.join(',')})&select=id,full_name`);
      (profs || []).forEach(p => { namesById[p.id] = p.full_name; });
    }

    box.innerHTML = data.map(h => {
      const meta = metaFor(h.key);
      const who = namesById[h.changed_by] || 'غير معروف';
      const when = h.changed_at ? new Date(h.changed_at).toLocaleString('ar') : '—';
      return `
        <div class="history-item">
          <div>
            <span class="setting-name">${escapeHtml(meta.label)}</span>
            — <span style="color:#a7afc4;">${escapeHtml(String(h.old_value ?? '—'))}</span>
            ← <span style="color:#2FAE66; font-weight:700;">${escapeHtml(String(h.new_value ?? '—'))}</span>
          </div>
          <div class="who-when">بواسطة ${escapeHtml(who)} — ${when}</div>
        </div>`;
    }).join('');
  }

  (async () => {
    const result = await bootAdminPage('settings', 'الإعدادات');
    if (!result) return;
    loadSettings();
    loadHistory();
  })();
</script>
</body>
</html>
